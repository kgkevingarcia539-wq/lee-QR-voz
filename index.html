<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner Inteligente con Voz</title>
    <!-- Cerebro de la cámara -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        /* Estilos generales futuristas */
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: radial-gradient(circle at center, #1e1b4b, #09090b); 
            color: #f4f4f5; 
            text-align: center; 
            margin: 0;
            padding: 40px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal con efecto de cristal y brillo neón */
        .container { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px);
            padding: 35px 25px; 
            border-radius: 24px; 
            max-width: 480px; 
            width: 90%; 
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            transition: all 0.5s ease;
        }

        h1 { 
            color: #f59e0b; 
            font-size: 2.2rem;
            margin: 0 0 10px 0; 
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p { 
            color: #94a3b8; 
            font-size: 15px; 
            margin-bottom: 30px; 
            line-height: 1.5;
        }

        /* Área de la cámara optimizada */
        #lector-camara { 
            width: 100%; 
            max-width: 320px; 
            margin: 0 auto; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #020617; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            border: 2px dashed rgba(245, 158, 11, 0.4);
            position: relative;
        }

        /* Cuadro de resultados inteligente */
        .resultado-box { 
            margin-top: 30px; 
            text-align: left;
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #34d399; 
            font-weight: 600; 
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }

        /* Caja de texto estilo consola hacker */
        textarea { 
            width: 100%; 
            height: 110px; 
            padding: 15px; 
            background: rgba(2, 6, 23, 0.8); 
            color: #34d399; 
            border: 1px solid rgba(52, 211, 153, 0.3); 
            border-radius: 12px; 
            font-size: 16px; 
            resize: none; 
            font-family: 'Fira Code', monospace;
            box-sizing: border-box;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        
        textarea:focus {
            outline: none;
            border-color: #34d399;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
        }

        /* Botón de activación con pulso de energía */
        button { 
            background: linear-gradient(135deg, #f59e0b, #d97706); 
            color: #020617; 
            font-weight: 700; 
            border: none; 
            padding: 16px 28px; 
            border-radius: 14px; 
            cursor: pointer; 
            margin-bottom: 20px; 
            font-size: 16px; 
            width: 100%; 
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover { 
            background: linear-gradient(135deg, #fbbf24, #f59e0b); 
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Enlace interactivo inferior */
        .link-fabrica {
            display: inline-block;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .link-fabrica:hover {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lee QR Voz 🤖🔊</h1>
        <p>Apunta a las instrucciones de cualquier código QR y la inteligencia artificial las leerá por ti de inmediato.</p>
        
        <button onclick="encenderCamara()">📷 ACTIVAR ESCÁNER</button>

        <!-- Cuadro de la cámara -->
        <div id="lector-camara"></div>

        <div class="resultado-box">
            <label for="textoPegado">⚡ Transcripción en Tiempo Real:</label>
            <textarea id="textoPegado" placeholder="Consola lista. Esperando instrucciones de la matriz QR..." readonly></textarea>
        </div>

        <a href="escaner.html" class="link-fabrica">🛠️ Ir a la Fábrica de QR</a>
    </div>

    <script>
        let html5QrcodeScanner;

        function encenderCamara() {
            // Cambiar dinámicamente el estilo del contenedor al activar
            document.querySelector('.container').style.borderColor = '#34d399';
            document.querySelector('.container').style.boxShadow = '0 0 40px rgba(52, 211, 153, 0.15)';

            html5QrcodeScanner = new Html5QrcodeScanner(
                "lector-camara", 
                { fps: 15, qrbox: { width: 220, height: 220 } },
                false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function onScanSuccess(textoDecodificado) {
            document.getElementById('textoPegado').value = textoDecodificado;
            
            // Regresar el borde a su estado original al terminar
            document.querySelector('.container').style.borderColor = 'rgba(245, 158, 11, 0.2)';
            
            html5QrcodeScanner.clear().catch(err => console.error(err));

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const discurso = new SpeechSynthesisUtterance(textoDecodificado);
                discurso.lang = 'es-MX'; 
                discurso.rate = 1.0;     
                window.speechSynthesis.speak(discurso);
            }
        }
    </script>
</body>
</html>
